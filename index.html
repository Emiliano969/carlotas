<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carlotas en vaso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff3d6;--ink:#3b1d12;--bg:#8fd16a;--sheet:#fff8e8;--sheet-ink:#3b1d12;--line:#e6d6b0;
  color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sheet:#2a1710;--sheet-ink:#fff3d6;--line:#4d3123}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#app{position:relative;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);transition:background .7s ease,color .7s ease;--mx:0;--my:0}
header{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,4vw,48px);z-index:6}
.logo{font-family:"Lilita One",cursive;font-size:28px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.pill{background:var(--ink);color:var(--cream);padding:11px 22px;border-radius:99px;font-weight:700;transition:transform .2s}
.pill:hover{transform:scale(1.05)}
h1{position:absolute;left:clamp(16px,5vw,72px);top:15vh;z-index:1;font-family:"Lilita One",cursive;font-weight:400;font-size:clamp(54px,12vw,170px);line-height:.88;letter-spacing:.01em;translate:calc(var(--mx)*-14px) calc(var(--my)*-8px);transition:translate .3s ease-out}
.stage{position:absolute;inset:0 0 15vh 0;display:grid;place-items:center;z-index:3;perspective:900px}
.cup{--h:min(54vh,108vw);position:absolute;height:var(--h);aspect-ratio:2/3;transition:transform .7s cubic-bezier(.2,.9,.25,1),opacity .5s,filter .5s;
  transform:translateX(calc(var(--o)*var(--h)*.78)) scale(calc(1 - var(--a)*.38));opacity:calc(1 - var(--a)*.4);filter:blur(calc(var(--a)*2.5px));border:0;background:none;padding:0}
.cup[data-hide="1"]{opacity:0;pointer-events:none}
.cup[data-on="1"]{animation:rise .9s cubic-bezier(.2,1.2,.3,1) both}
@keyframes rise{from{translate:0 40vh;rotate:-8deg}}
.cup svg{width:100%;height:100%;overflow:visible;transform:rotateY(calc(var(--mx)*10deg)) rotateX(calc(var(--my)*-6deg));transition:transform .3s ease-out}
.cup g.d{transform-box:fill-box;transition:translate .3s ease-out}
.d1{translate:calc(var(--mx)*5px) calc(var(--my)*3px)}
.d2{translate:calc(var(--mx)*13px) calc(var(--my)*8px)}
.d3{translate:calc(var(--mx)*26px) calc(var(--my)*16px)}
.wave{position:absolute;left:0;right:0;bottom:0;height:26vh;z-index:2}
.wave svg{width:100%;height:100%;display:block}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(16px,4vw,48px) 22px;color:var(--ink-fixed,#3b1d12)}
.info{color:#3b1d12;min-width:0}
.info b{display:block;font-family:"Lilita One",cursive;font-weight:400;font-size:clamp(22px,3.4vw,38px)}
.info span{font-size:14px;opacity:.8;display:block;max-width:34ch}
.sizes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.sizes button{padding:7px 14px;border-radius:99px;background:#fff;box-shadow:0 0 0 2px #3b1d12 inset;color:#3b1d12;font-weight:700;font-size:14px}.sizes button[aria-pressed=true]{background:#3b1d12;color:#fff3d6}
.nav{display:flex;gap:10px;align-items:center}
.nav button{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #3b1d12 inset;font-size:20px;color:#3b1d12}
.dots{display:flex;gap:7px}.dots i{width:9px;height:9px;border-radius:50%;background:#3b1d12;opacity:.25;transition:.3s}.dots i.on{opacity:1;width:24px;border-radius:9px}
.cta{background:#3b1d12;color:#fff3d6;padding:15px 28px;border-radius:99px;font-weight:700;font-size:16px;white-space:nowrap}
.cta:hover{transform:scale(1.05)}
.sheet{position:fixed;inset:0;z-index:20;pointer-events:none}
.sheet .scrim{position:absolute;inset:0;background:#2a120a99;opacity:0;transition:opacity .4s}
.sheet .panel{position:absolute;left:50%;bottom:0;width:min(520px,100%);max-height:92%;overflow:auto;background:var(--sheet);color:var(--sheet-ink);border-radius:28px 28px 0 0;padding:26px 22px calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,105%);transition:transform .5s cubic-bezier(.2,.9,.25,1)}
.sheet.open{pointer-events:auto}.sheet.open .scrim{opacity:1}.sheet.open .panel{transform:translate(-50%,0)}
.panel h2{font-family:"Lilita One",cursive;font-weight:400;font-size:32px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .sw{width:22px;height:22px;border-radius:50%;flex:none}
.row .nm{flex:1;font-weight:500}.row small{display:block;opacity:.65}
.step{display:flex;align-items:center;gap:10px}
.step button{width:32px;height:32px;border-radius:50%;background:var(--line);font-size:18px;color:var(--sheet-ink)}
.step output{min-width:18px;text-align:center;font-weight:700}
label{display:block;margin-top:14px;font-size:14px;font-weight:500}
input{width:100%;margin-top:6px;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:transparent;color:inherit;font:inherit}
.total{display:flex;justify-content:space-between;margin:18px 0 14px;font-size:20px;font-weight:700}
.send{width:100%;background:#25a244;color:#fff;padding:16px;border-radius:99px;font-weight:700;font-size:17px}
.send:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:13px;opacity:.7;margin-top:8px;text-align:center;min-height:1em}
@media (max-width:700px){
  h1{top:11vh}
  .bar{flex-wrap:wrap;padding-bottom:16px}
  .info{flex:1 1 100%}.info span{display:none}
  .stage{inset:4vh 0 24vh 0}.wave{height:30vh}
  .cta{padding:13px 22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header><div class="logo">Carlotas</div><button class="pill" id="openTop">Mi pedido <span id="count"></span></button></header>
  <h1>Carlotas<br>en vaso</h1>
  <div class="stage" id="stage" aria-live="polite"></div>
  <div class="wave"><svg viewBox="0 0 1440 200" preserveAspectRatio="none" aria-hidden="true"><path d="M0 110C120 50 230 30 370 85S610 160 770 105 1070 25 1210 85 1380 120 1440 70V200H0Z" fill="#fff3d6"/></svg></div>
  <div class="bar">
    <div class="info"><b id="fname"></b><span id="fdesc"></span><div class="sizes" id="sizes" role="group" aria-label="Tamaño"></div></div>
    <div class="nav"><button id="prev" aria-label="Sabor anterior">‹</button><div class="dots" id="dots"></div><button id="next" aria-label="Sabor siguiente">›</button></div>
    <button class="cta" id="add"></button>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Tu pedido">
  <div class="scrim" id="scrim"></div>
  <div class="panel">
    <h2>Tu pedido</h2>
    <div id="rows"></div>
    <label>Tu nombre<input id="name" autocomplete="name" placeholder="¿Cómo te llamas?"></label>
    
    <label>Notas (opcional)<input id="notes" placeholder="Sin topping, para las 5 pm…"></label>
    <div class="total"><span>Total</span><span id="total">$0</span></div>
    <button class="send" id="send" disabled>Enviar pedido por WhatsApp</button>
    <p class="hint" id="hint">Agrega al menos una carlota y tu nombre.</p>
  </div>
</div>

<script>
// ===== CONFIGURA AQUÍ =====
const WHATSAPP = "528711200188"; // 52 + 10 dígitos
const FLAVORS = [
  {id:"limon",name:"Carlota de Limón",desc:"Crema de limón, galleta y ralladura fresca.",p:{c:25,n:30,g:35},bg:"#8fd16a",main:"#c9ef7a",deep:"#7cb83c",acc:"#4fa32a"},
  {id:"mango",name:"Carlota de Mango",desc:"Mango natural, crema ligera y galleta.",p:{c:25,n:30,g:35},bg:"#f7bd4d",main:"#ffc43d",deep:"#f08c1a",acc:"#e8730c"},
  {id:"oreo",name:"Carlota de Oreo",desc:"Crema con galleta Oreo en capas.",p:{n:35},bg:"#b9b3d6",main:"#4a3a36",deep:"#2b211f",acc:"#2b211f"},
  {id:"mazapan",name:"Carlota de Mazapán",desc:"Crema con mazapán y galleta.",p:{n:35},bg:"#f2d3a0",main:"#e9b873",deep:"#c98a45",acc:"#d9a15b"}
];
// ==========================
const $=s=>document.querySelector(s);
const SIZES=[["c","Chico"],["n","Normal"],["g","Grande"]],SN=Object.fromEntries(SIZES);
const qty={};let cur=0,sz="n";
const LINES=()=>FLAVORS.flatMap(f=>SIZES.filter(([k])=>f.p[k]&&qty[f.id+"|"+k]>0).map(([k])=>[f,k,qty[f.id+"|"+k]]));

function cupSVG(f,k){
  const cl="c"+k;
  const crumbs=[[62,70],[92,52],[128,66],[78,90],[112,88],[142,92],[100,70]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${4+i%3}" fill="${i%2?"#d9a15b":"#b9773a"}"/>`).join("");
  return `<svg viewBox="0 0 200 300" aria-hidden="true">
  <defs><clipPath id="${cl}"><path d="M30 122H170L153 268Q151 282 138 282H62Q49 282 47 268Z"/></clipPath></defs>
  <ellipse cx="100" cy="288" rx="66" ry="9" fill="#00000026"/>
  <g class="d d1">
    <path d="M30 122H170L153 268Q151 282 138 282H62Q49 282 47 268Z" fill="#ffffff55"/>
    <g clip-path="url(#${cl})">
      <rect x="20" y="122" width="170" height="30" fill="#fff6e2"/>
      <rect x="20" y="152" width="170" height="26" fill="${f.main}"/>
      <rect x="20" y="178" width="170" height="20" fill="#e8c88f"/>
      <rect x="20" y="198" width="170" height="26" fill="#fff6e2"/>
      <rect x="20" y="224" width="170" height="24" fill="${f.deep}"/>
      <rect x="20" y="248" width="170" height="40" fill="#e8c88f"/>
      <path d="M40 130L52 270" stroke="#fff" stroke-opacity=".45" stroke-width="7" stroke-linecap="round"/>
    </g>
    <path d="M30 122H170L153 268Q151 282 138 282H62Q49 282 47 268Z" fill="none" stroke="#3b1d12" stroke-opacity=".25" stroke-width="2"/>
    <rect x="24" y="114" width="152" height="12" rx="6" fill="#fff" fill-opacity=".85"/>
    <rect x="62" y="190" width="76" height="42" rx="10" fill="#3b1d12"/>
    <text x="100" y="208" text-anchor="middle" font-family="Lilita One,cursive" font-size="14" fill="#fff3d6">Carlota</text>
    <text x="100" y="224" text-anchor="middle" font-family="DM Sans,sans-serif" font-weight="700" font-size="11" fill="#ffd9a0">${f.name.split(" de ")[1]}</text>
  </g>
  <g class="d d2">
    <path d="M38 118Q34 92 62 90Q58 62 92 62Q106 36 134 58Q166 56 160 92Q172 106 162 118Z" fill="#fff6e2"/>
    <path d="M52 108Q80 98 110 106T158 106" stroke="${f.main}" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <g class="d d3">${crumbs}
    <circle cx="100" cy="40" r="15" fill="${f.acc}"/><circle cx="96" cy="35" r="4" fill="#fff" fill-opacity=".55"/>
    <path d="M100 26Q98 14 108 10" stroke="#4fa32a" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g></svg>`;
}
const stage=$("#stage");
stage.innerHTML=FLAVORS.map((f,i)=>`<button class="cup" data-i="${i}" aria-label="${f.name}">${cupSVG(f,i)}</button>`).join("");
$("#dots").innerHTML=FLAVORS.map(()=>"<i></i>").join("");
stage.addEventListener("click",e=>{const b=e.target.closest(".cup");if(!b)return;const i=+b.dataset.i;if(i===cur)addCur();else go(i)});

function render(){
  const n=FLAVORS.length,f=FLAVORS[cur];
  document.querySelectorAll(".cup").forEach((el,j)=>{
    const o=((j-cur+n+n/2)%n)-n/2,a=Math.abs(o);
    el.style.setProperty("--o",o);el.style.setProperty("--a",Math.min(a,2));
    el.dataset.hide=a>1?1:0;el.style.zIndex=a===0?3:1;el.tabIndex=a===0?0:-1;
  });
  const app=$("#app");app.style.setProperty("--bg",f.bg);app.style.background=f.bg;
  document.documentElement.style.setProperty("--bg",f.bg);
  $("#fname").textContent=f.name;$("#fdesc").textContent=f.desc;
  if(!f.p[sz])sz="n";
  $("#sizes").innerHTML=SIZES.filter(([k])=>f.p[k]).map(([k,l])=>`<button data-k="${k}" aria-pressed="${k===sz}">${l} $${f.p[k]}</button>`).join("");
  $("#add").textContent=`Pedir · $${f.p[sz]}`;
  document.querySelectorAll(".dots i").forEach((d,i)=>d.classList.toggle("on",i===cur));
}
function go(i){cur=(i+FLAVORS.length)%FLAVORS.length;render()}
$("#sizes").onclick=e=>{const b=e.target.closest("button");if(b){sz=b.dataset.k;render()}};
$("#prev").onclick=()=>go(cur-1);$("#next").onclick=()=>go(cur+1);
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(cur-1);if(e.key==="ArrowRight")go(cur+1);if(e.key==="Escape")toggle(false)});
let sx=null;stage.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
stage.addEventListener("touchend",e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>40)go(cur+(d<0?1:-1));sx=null});
addEventListener("pointermove",e=>{const a=$("#app");a.style.setProperty("--mx",((e.clientX/innerWidth)*2-1).toFixed(3));a.style.setProperty("--my",((e.clientY/innerHeight)*2-1).toFixed(3))});

function addCur(){const k=FLAVORS[cur].id+"|"+sz;qty[k]=(qty[k]||0)+1;toggle(true)}
$("#add").onclick=addCur;
$("#openTop").onclick=()=>toggle(true);$("#scrim").onclick=()=>toggle(false);
let sheetOpen=false;
function toggle(v){sheetOpen=v;$("#sheet").classList.toggle("open",v);drawRows()}
function drawRows(){
  $("#rows").innerHTML=LINES().map(([f,k,n])=>`<div class="row"><span class="sw" style="background:${f.main}"></span><div class="nm">${f.name}<small>${SN[k]} · $${f.p[k]} c/u</small></div>
  <div class="step"><button data-id="${f.id}|${k}" data-d="-1" aria-label="Quitar ${f.name}">−</button><output>${n}</output><button data-id="${f.id}|${k}" data-d="1" aria-label="Agregar ${f.name}">+</button></div></div>`).join("")||'<p class="hint">Aún no agregas nada. Elige un sabor y toca Pedir.</p>';
  const L=LINES(),total=L.reduce((s,[f,k,n])=>s+f.p[k]*n,0),units=L.reduce((s,[,,n])=>s+n,0);
  $("#total").textContent="$"+total;$("#count").textContent=units?`(${units})`:"";
  const ok=units>0&&$("#name").value.trim();$("#send").disabled=!ok;
  $("#hint").textContent=ok?"Se abrirá WhatsApp con tu pedido listo para enviar.":"Agrega al menos una carlota y tu nombre.";
}
$("#rows").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.id;qty[id]=Math.max(0,qty[id]+ +b.dataset.d);drawRows()});
$("#name").addEventListener("input",drawRows);
$("#send").onclick=()=>{
  const L=LINES();
  const total=L.reduce((s,[f,k,n])=>s+f.p[k]*n,0);
  const msg=["¡Hola! Quiero hacer un pedido 🍨","",...L.map(([f,k,n])=>`• ${n} x ${f.name} (${SN[k]}) $${f.p[k]*n}`),"",`Total: $${total}`,`Nombre: ${$("#name").value.trim()}`,
    $("#notes").value.trim()&&`Notas: ${$("#notes").value.trim()}`].filter(x=>x!==""&&x!==false&&x!==undefined).join("\n");
  open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,"_blank");
};
render();drawRows();
document.querySelectorAll(".cup")[0].dataset.on=1;
</script>
</body>
</html>
